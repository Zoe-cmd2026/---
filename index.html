<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg:#f3f6f0;
    --card:#ffffff;
    --ink:#1d2b23;
    --muted:#7b8b80;
    --line:#e5ece3;
    --green:#2f9e63;
    --green-dark:#1f7a4a;
    --accent:#ff7a59;
    --shadow:0 16px 44px rgba(30,70,45,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 12% -10%, #e2f3e6 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #fdf0e4 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;
    padding:28px 18px 40px;
  }
  .app{width:100%;max-width:600px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:46px;height:46px;border-radius:15px;flex:none;
    background:linear-gradient(145deg,#3cb877,#1f8a54);
    box-shadow:0 8px 20px rgba(36,140,84,.28);
    display:grid;place-items:center;
  }
  h1{font-size:21px;line-height:1.1;margin:0;letter-spacing:1px;font-weight:800}
  .sub{margin:4px 0 0;font-size:11px;color:var(--muted);letter-spacing:2.2px;font-weight:600}
  .icon-btn{
    width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;font-size:18px;
    display:grid;place-items:center;transition:.18s;box-shadow:0 3px 10px rgba(30,70,45,.05);
  }
  .icon-btn:hover{transform:translateY(-2px);border-color:#cfdfd1}
  .icon-btn.off{color:#b6c1b8}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:11px 12px 12px;box-shadow:0 3px 12px rgba(30,70,45,.04);
  }
  .stat .label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .stat strong{font-size:21px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
  .stat.hl strong{color:var(--green-dark)}
  .stat small{font-size:12px;color:var(--muted);font-weight:600}

  .board-shell{
    position:relative;border-radius:24px;overflow:hidden;
    background:#eaf1e6;border:1px solid #dce8d8;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:12px;
    background:rgba(247,250,245,.80);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    padding:24px;transition:opacity .22s;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .ov-icon{font-size:44px;line-height:1;filter:drop-shadow(0 6px 10px rgba(30,70,45,.15))}
  .ov-title{font-size:26px;font-weight:850;margin:0;letter-spacing:1px}
  .ov-desc{font-size:13px;color:var(--muted);margin:0;line-height:1.7}
  .ov-score{font-size:14px;color:var(--green-dark);font-weight:700;margin:0}
  .ov-btn{
    margin-top:8px;border:0;border-radius:14px;padding:12px 30px;
    background:linear-gradient(145deg,#3cb877,#218a54);color:#fff;
    font-size:15px;font-weight:750;cursor:pointer;
    box-shadow:0 8px 20px rgba(36,140,84,.30);transition:.18s;
    font-family:inherit;
  }
  .ov-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(36,140,84,.36)}
  .ov-btn:active{transform:translateY(0)}
  .new-record{
    display:inline-block;background:#fff2e6;color:#e2663f;border-radius:999px;
    padding:4px 12px;font-size:12px;font-weight:750;margin-top:2px;
  }

  .controls{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    flex:1;min-width:110px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;
    cursor:pointer;transition:.18s;font-family:inherit;box-shadow:0 3px 10px rgba(30,70,45,.04);
  }
  .btn:hover{transform:translateY(-2px);border-color:#cfdfd1}
  .btn.primary{
    background:linear-gradient(145deg,#3cb877,#218a54);color:#fff;border-color:transparent;
    box-shadow:0 8px 20px rgba(36,140,84,.26);
  }
  .btn.primary:hover{box-shadow:0 12px 24px rgba(36,140,84,.34)}

  .seg{
    display:flex;background:#e9efe6;border-radius:13px;padding:4px;gap:2px;flex:1;min-width:210px;
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);border-radius:10px;
    padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .seg button.active{background:#fff;color:var(--green-dark);box-shadow:0 2px 8px rgba(30,70,45,.10)}
  .switch{
    display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:9px 13px;font-size:13px;font-weight:650;cursor:pointer;
    user-select:none;white-space:nowrap;
  }
  .switch input{display:none}
  .track{
    width:34px;height:20px;border-radius:999px;background:#d8e2d7;position:relative;transition:.2s;flex:none;
  }
  .track::after{
    content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:.2s;
  }
  .switch input:checked + .track{background:var(--green)}
  .switch input:checked + .track::after{transform:translateX(14px)}

  .dpad{display:none;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);
    gap:8px;justify-content:center;margin:18px auto 0}
  .dpad button{
    border:1px solid var(--line);background:var(--card);border-radius:16px;font-size:22px;
    color:var(--green-dark);box-shadow:0 4px 12px rgba(30,70,45,.07);cursor:pointer;
  }
  .dpad button:active{background:#e7f4ea;transform:scale(.94)}
  .dpad .up{grid-column:2;grid-row:1}
  .dpad .left{grid-column:1;grid-row:2}
  .dpad .down{grid-column:2;grid-row:2}
  .dpad .right{grid-column:3;grid-row:2}

  footer{
    margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:2.2;
  }
  kbd{
    display:inline-block;background:var(--card);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;padding:1px 6px;margin:0 1px;
    font-family:inherit;font-size:11px;font-weight:700;color:#4c5f53;
  }
  .hint{font-size:11px;color:#9aa89e;margin-top:6px}

  @media (max-width:560px){
    body{padding:18px 14px 30px}
    h1{font-size:19px}
    .stat{padding:9px 8px 10px;border-radius:13px}
    .stat .label{font-size:10px}
    .stat strong{font-size:17px}
    .dpad{display:grid}
    .controls{gap:10px}
    footer{line-height:2}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M4 18c3.5 0 3.5-4 7-4s3.5 4 7 4 4-2.5 4-5" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="21" cy="9" r="1.7" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>贪吃蛇</h1>
        <p class="sub">SNAKE · 经典重制</p>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
  </header>

  <section class="stats">
    <div class="stat hl"><span class="label">当前得分</span><strong id="score">0</strong></div>
    <div class="stat"><span class="label">最高纪录</span><strong id="best">0</strong></div>
    <div class="stat"><span class="label">长度</span><strong id="length">3</strong></div>
    <div class="stat"><span class="label">速度</span><strong id="speedLabel"><small>标准</small></strong></div>
  </section>

  <div class="board-shell">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <section class="controls">
    <div class="row">
      <button class="btn primary" id="startBtn">开始游戏</button>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>
    <div class="row">
      <div class="seg" id="speedSeg">
        <button data-speed="0">悠闲</button>
        <button data-speed="1" class="active">标准</button>
        <button data-speed="2">快速</button>
        <button data-speed="3">疯狂</button>
      </div>
      <label class="switch" title="开启后撞墙会从另一侧穿出">
        <input type="checkbox" id="wallToggle">
        <span class="track"></span>
        <span>穿墙</span>
      </label>
    </div>
  </section>

  <div class="dpad" id="dpad">
    <button class="up" data-dir="up" aria-label="向上">↑</button>
    <button class="left" data-dir="left" aria-label="向左">←</button>
    <button class="down" data-dir="down" aria-label="向下">↓</button>
    <button class="right" data-dir="right" aria-label="向右">→</button>
  </div>

  <footer>
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W A S D</kbd> 转向 ·
    <kbd>空格</kbd> 暂停 / 继续 · <kbd>R</kbd> 重开
    <div class="hint">手机可直接滑动屏幕操作 · 吃得越多速度越快</div>
  </footer>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 常量与 DOM ---------- */
  const GRID = 20;
  const CELL = 28;
  const BOARD = GRID * CELL; // 560 逻辑像素
  const SPEEDS = [
    {name:'悠闲', base:180},
    {name:'标准', base:125},
    {name:'快速', base:90},
    {name:'疯狂', base:62}
  ];
  const DIRS = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const elScore = $('score'), elBest = $('best'), elLength = $('length'),
        elSpeedLabel = $('speedLabel'), elOverlay = $('overlay'),
        elStart = $('startBtn'), elRestart = $('restartBtn'),
        elSound = $('soundBtn'), elWall = $('wallToggle'), elSeg = $('speedSeg');

  /* ---------- 状态 ---------- */
  let state = 'ready';              // ready | playing | paused | over
  let snake = [], prevSnake = [], food = {x:0,y:0};
  let dir = DIRS.right, dirQueue = [];
  let score = 0, best = 0, bestAtStart = 0, speedIdx = 1, wrap = false, soundOn = true;
  let particles = [], floaters = [], acc = 0, last = performance.now(), tick = 0;
  let shake = 0;

  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch(e){}
  try { soundOn = localStorage.getItem('snake_sound') !== 'off'; } catch(e){}

  /* ---------- 音效（Web Audio 合成，无外部资源） ---------- */
  let audioCtx = null;
  function tone(freq, dur, type, vol, endFreq){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if(endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(40,endFreq), t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }catch(e){}
  }
  const sfxEat  = () => { tone(520, .09, 'sine', .07, 780); setTimeout(()=>tone(880,.09,'sine',.05),55); };
  const sfxOver = () => { tone(260, .42, 'triangle', .09, 70); };
  const sfxClick= () => { tone(420, .05, 'sine', .035); };

  /* ---------- 画布适配 ---------- */
  function fitCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = BOARD * dpr;
    canvas.height = BOARD * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* ---------- 游戏逻辑 ---------- */
  function interval(){
    // 每得 40 分（4 个食物）提速 5ms，最多提速 38ms
    return Math.max(48, SPEEDS[speedIdx].base - Math.min(38, Math.floor(score / 40) * 5));
  }
  function reset(){
    const cy = Math.floor(GRID / 2);
    snake = [{x:6,y:cy},{x:5,y:cy},{x:4,y:cy}];
    prevSnake = snake.map(p => ({x:p.x, y:p.y}));
    dir = DIRS.right; dirQueue = [];
    score = 0; bestAtStart = best; acc = 0; tick = 0; shake = 0;
    particles = []; floaters = [];
    placeFood();
    syncUI();
  }
  function placeFood(){
    const free = [];
    const occupied = new Set(snake.map(p => p.x + ',' + p.y));
    for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
      if(!occupied.has(x + ',' + y)) free.push({x,y});
    }
    if(!free.length){ food = {x:-1,y:-1}; return; } // 通关
    food = free[Math.floor(Math.random() * free.length)];
  }
  function queueDir(name){
    const d = DIRS[name]; if(!d) return;
    const lastDir = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    if(d.x === -lastDir.x && d.y === -lastDir.y) return; // 禁止 180° 掉头
    if(d.x === lastDir.x && d.y === lastDir.y) return;
    if(dirQueue.length < 2) dirQueue.push(d);
  }
  function burst(x, y, color){
    for(let i=0;i<10;i++){
      const a = Math.random() * Math.PI * 2, sp = .6 + Math.random()*1.9;
      particles.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color});
    }
  }
  function step(){
    prevSnake = snake.map(p => ({x:p.x, y:p.y}));
    if(dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    let nx = head.x + dir.x, ny = head.y + dir.y;

    if(wrap){
      nx = (nx + GRID) % GRID;
      ny = (ny + GRID) % GRID;
    }else if(nx < 0 || ny < 0 || nx >= GRID || ny >= GRID){
      return gameOver();
    }

    const eating = (nx === food.x && ny === food.y);
    const body = eating ? snake : snake.slice(0, -1); // 不吃时尾巴会移开，可安全占用
    if(body.some(p => p.x === nx && p.y === ny)) return gameOver();

    snake.unshift({x:nx, y:ny});
    if(eating){
      score += 10;
      burst(food.x + .5, food.y + .5, '#ff8a5c');
      floaters.push({x:food.x + .5, y:food.y + .5, life:1, text:'+10'});
      sfxEat();
      if(score > best){
        best = score;
        try{ localStorage.setItem('snake_best', String(best)); }catch(e){}
      }
      placeFood();
      if(food.x === -1) return win();
    }else{
      snake.pop();
    }
    tick++;
    syncUI();
  }
  function win(){
    state = 'over';
    sfxEat();
    showOverlay({icon:'🏆', title:'满屏通关！', desc:'你把整个棋盘都占满了，太强了。', score:true, btn:'再来一局'});
    syncUI();
  }
  function gameOver(){
    state = 'over';
    shake = 1;
    sfxOver();
    const isNew = score > 0 && score > bestAtStart;
    showOverlay({
      icon:'💥', title:'游戏结束',
      desc: wrap ? '撞到自己啦，换个方向再来一次！' : '撞墙或撞到自己啦，换个方向再来一次！',
      score:true, record:isNew, btn:'再来一局'
    });
    syncUI();
  }
  function startOrToggle(){
    if(state === 'playing'){ pause(); return; }
    if(state === 'paused'){ resume(); return; }
    reset();
    state = 'playing';
    last = performance.now(); acc = 0;
    hideOverlay(); syncUI(); sfxClick();
  }
  function pause(){
    if(state !== 'playing') return;
    state = 'paused';
    showOverlay({icon:'⏸️', title:'已暂停', desc:'休息一下，随时继续。', btn:'继续游戏'});
    syncUI();
  }
  function resume(){
    if(state !== 'paused') return;
    state = 'playing';
    last = performance.now(); acc = 0;
    hideOverlay(); syncUI(); sfxClick();
  }
  function restart(){
    reset();
    state = 'playing';
    last = performance.now(); acc = 0;
    hideOverlay(); syncUI(); sfxClick();
  }

  /* ---------- 界面 ---------- */
  function syncUI(){
    elScore.textContent = score;
    elBest.textContent = best;
    elLength.textContent = snake.length;
    elSpeedLabel.innerHTML = '<small>' + SPEEDS[speedIdx].name + '</small>';
    elStart.textContent = state === 'playing' ? '暂停游戏' : state === 'paused' ? '继续游戏' : state === 'over' ? '再来一局' : '开始游戏';
    elSound.textContent = soundOn ? '🔊' : '🔇';
    elSound.classList.toggle('off', !soundOn);
  }
  function showOverlay(o){
    elOverlay.innerHTML =
      '<div class="ov-icon">' + o.icon + '</div>' +
      '<h2 class="ov-title">' + o.title + '</h2>' +
      (o.desc ? '<p class="ov-desc">' + o.desc + '</p>' : '') +
      (o.score ? '<p class="ov-score">本局得分 ' + score + ' · 最高 ' + best + '</p>' : '') +
      (o.record ? '<span class="new-record">✨ 新纪录</span>' : '') +
      '<button class="ov-btn" id="ovBtn">' + o.btn + '</button>';
    elOverlay.classList.remove('hidden');
    $('ovBtn').addEventListener('click', startOrToggle);
  }
  function hideOverlay(){ elOverlay.classList.add('hidden'); }

  /* ---------- 绘制 ---------- */
  function roundRect(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }
  function drawGrid(){
    ctx.fillStyle = '#eaf1e6';
    ctx.fillRect(0, 0, BOARD, BOARD);
    const g = ctx.createRadialGradient(BOARD*.5, BOARD*.35, 20, BOARD*.5, BOARD*.5, BOARD*.78);
    g.addColorStop(0, 'rgba(255,255,255,.55)');
    g.addColorStop(1, 'rgba(190,215,190,.18)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, BOARD, BOARD);
    ctx.strokeStyle = 'rgba(60,120,80,.055)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=1;i<GRID;i++){
      ctx.moveTo(i*CELL+.5, 0); ctx.lineTo(i*CELL+.5, BOARD);
      ctx.moveTo(0, i*CELL+.5); ctx.lineTo(BOARD, i*CELL+.5);
    }
    ctx.stroke();
    // 四角装饰
    ctx.fillStyle = 'rgba(47,158,99,.13)';
    [[10,10],[BOARD-10,10],[10,BOARD-10],[BOARD-10,BOARD-10]].forEach(p=>{
      ctx.beginPath(); ctx.arc(p[0],p[1],4,0,Math.PI*2); ctx.fill();
    });
  }
  function drawFood(now){
    if(food.x < 0) return;
    const cx = (food.x + .5) * CELL, cy = (food.y + .5) * CELL;
    const pulse = 1 + Math.sin(now / 260) * .06;
    const R = CELL * .34 * pulse;
    ctx.save();
    // 光晕
    const halo = ctx.createRadialGradient(cx, cy, 2, cx, cy, CELL*.85);
    halo.addColorStop(0, 'rgba(255,122,89,.24)');
    halo.addColorStop(1, 'rgba(255,122,89,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, CELL*.85, 0, Math.PI*2); ctx.fill();
    // 果实
    const g = ctx.createLinearGradient(cx-R, cy-R, cx+R, cy+R);
    g.addColorStop(0, '#ff9b6b'); g.addColorStop(.5, '#ff7043'); g.addColorStop(1, '#e94f36');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(220,80,50,.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(cx, cy+1, R, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(cx-R*.32, cy-R*.38, R*.26, R*.16, -.6, 0, Math.PI*2); ctx.fill();
    // 叶子与梗
    ctx.strokeStyle = '#6b7f4a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy-R*.85); ctx.lineTo(cx+1, cy-R*1.25); ctx.stroke();
    ctx.fillStyle = '#5fa860';
    ctx.beginPath(); ctx.ellipse(cx+R*.42, cy-R*1.15, R*.38, R*.19, -.45, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function interp(i, alpha){
    const to = snake[i];
    const from = prevSnake[i] || prevSnake[prevSnake.length-1] || to;
    const dx = to.x - from.x, dy = to.y - from.y;
    if(Math.abs(dx) > 1 || Math.abs(dy) > 1) return {x:to.x, y:to.y}; // 穿墙瞬移不插值
    const a = (state === 'playing') ? Math.min(1, alpha) : 1;
    return {x: from.x + dx*a, y: from.y + dy*a};
  }
  function drawSnake(alpha){
    const pad = 2.2, size = CELL - pad*2;
    // 阴影底层
    for(let i=snake.length-1;i>=0;i--){
      const p = interp(i, alpha);
      ctx.fillStyle = 'rgba(30,80,50,.10)';
      roundRect(p.x*CELL+pad, p.y*CELL+pad+2.5, size, size, 8);
      ctx.fill();
    }
    // 身体
    for(let i=snake.length-1;i>=0;i--){
      const p = interp(i, alpha);
      const t = snake.length > 1 ? i/(snake.length-1) : 0;
      const light = 40 + t*24;
      const g = ctx.createLinearGradient(p.x*CELL, p.y*CELL, (p.x+1)*CELL, (p.y+1)*CELL);
      g.addColorStop(0, 'hsl(146,46%,' + (light+5) + '%)');
      g.addColorStop(1, 'hsl(142,42%,' + (light-4) + '%)');
      ctx.fillStyle = i === 0 ? '#1e8a52' : g;
      roundRect(p.x*CELL+pad, p.y*CELL+pad, size, size, i===0 ? 9 : 7);
      ctx.fill();
      // 鳞片高光
      if(i > 0){
        ctx.fillStyle = 'rgba(255,255,255,.16)';
        roundRect(p.x*CELL+pad+3, p.y*CELL+pad+3, size-6, (size-6)*.32, 4);
        ctx.fill();
      }
    }
    // 眼睛
    const h = interp(0, alpha);
    const cx = (h.x+.5)*CELL, cy = (h.y+.5)*CELL;
    const fx = dir.x, fy = dir.y, px = -fy, py = fx;
    const f = CELL*.17, s = CELL*.21, er = CELL*.105;
    [[fx*f+px*s, fy*f+py*s], [fx*f-px*s, fy*f-py*s]].forEach(e=>{
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx+e[0], cy+e[1], er, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#173a28';
      ctx.beginPath(); ctx.arc(cx+e[0]+fx*1.3, cy+e[1]+fy*1.3, er*.52, 0, Math.PI*2); ctx.fill();
    });
  }
  function drawEffects(dt){
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p=>{
      p.x += p.vx * dt/16; p.y += p.vy * dt/16;
      p.vx *= .96; p.vy *= .96; p.life -= dt/420;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x*CELL, p.y*CELL, 3.2*p.life+1, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    floaters = floaters.filter(f => f.life > 0);
    floaters.forEach(f=>{
      f.life -= dt/800;
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = '#e2663f';
      ctx.font = '800 15px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x*CELL, f.y*CELL - (1-f.life)*24);
    });
    ctx.globalAlpha = 1;
    if(shake > 0) shake = Math.max(0, shake - dt/300);
  }
  function render(now, dt, alpha){
    ctx.save();
    if(shake > 0){
      const s = shake * 6;
      ctx.translate((Math.random()-.5)*s, (Math.random()-.5)*s);
    }
    drawGrid();
    drawFood(now);
    drawSnake(alpha);
    drawEffects(dt);
    ctx.restore();
  }

  /* ---------- 主循环 ---------- */
  function frame(now){
    let dt = now - last;
    last = now;
    if(dt > 120) dt = 120; // 切回标签页时防止一次跑很多步
    if(state === 'playing'){
      acc += dt;
      const iv = interval();
      let guard = 0;
      while(acc >= iv && guard++ < 5){
        acc -= iv;
        step();
        if(state !== 'playing'){ acc = 0; break; }
      }
    }
    render(now, dt, acc / interval());
    requestAnimationFrame(frame);
  }

  /* ---------- 输入 ---------- */
  const keyMap = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  window.addEventListener('keydown', e=>{
    if(keyMap[e.key]){
      e.preventDefault();
      if(state === 'ready' || state === 'over'){ startOrToggle(); }
      if(state === 'paused'){ resume(); }
      queueDir(keyMap[e.key]);
      return;
    }
    if(e.code === 'Space' || e.key === ' '){
      e.preventDefault(); startOrToggle();
    }else if(e.key === 'r' || e.key === 'R'){
      e.preventDefault(); restart();
    }else if(e.key === 'Escape'){
      pause();
    }
  }, {passive:false});

  // 触摸滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    touchStart = {x:t.clientX, y:t.clientY};
  }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchend', e=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if(state === 'ready' || state === 'over') startOrToggle();
    else if(state === 'paused') resume();
    queueDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, {passive:true});

  // 虚拟方向键
  $('dpad').addEventListener('click', e=>{
    const b = e.target.closest('button[data-dir]'); if(!b) return;
    if(state === 'ready' || state === 'over') startOrToggle();
    else if(state === 'paused') resume();
    queueDir(b.dataset.dir);
  });

  elStart.addEventListener('click', startOrToggle);
  elRestart.addEventListener('click', restart);
  elSeg.addEventListener('click', e=>{
    const b = e.target.closest('button[data-speed]'); if(!b) return;
    speedIdx = parseInt(b.dataset.speed, 10);
    [...elSeg.children].forEach(c => c.classList.toggle('active', c === b));
    syncUI(); sfxClick();
  });
  elWall.addEventListener('change', ()=>{ wrap = elWall.checked; sfxClick(); });
  elSound.addEventListener('click', ()=>{
    soundOn = !soundOn;
    try{ localStorage.setItem('snake_sound', soundOn ? 'on' : 'off'); }catch(e){}
    syncUI(); if(soundOn) sfxClick();
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });

  /* ---------- 启动 ---------- */
  reset();
  syncUI();
  showOverlay({
    icon:'🐍', title:'准备好了吗？',
    desc:'吃掉苹果让蛇变长，别撞到墙，也别咬到自己。<br>按空格键或点击下方按钮开始。',
    btn:'开始游戏'
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
